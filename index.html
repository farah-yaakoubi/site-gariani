<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1c" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  </head>
  <body>
    <!-- Netlify detects these forms during the production build. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="nom" /><input name="email" /><input name="telephone" />
      <input name="sujet" /><input name="message" />
    </form>
    <form name="compte" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="compte" />
      <input name="bot-field" />
      <input name="prenom" /><input name="nom" /><input name="entreprise" />
      <input name="type_compte" /><input name="email" /><input name="telephone" />
      <input name="adresse" /><input name="notes" />
    </form>
    <form name="newsletter" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
    </form>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
